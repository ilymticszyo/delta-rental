openapi: 3.0.3
info:
  title: 三角洲行动 · 账号租赁与回收估值 API
  version: 0.3.2-draft
  description: |
    前端（Vue，src/api/http.ts）与后端之间的契约。人类可读说明见 docs/api-contract.md，两者冲突时以本文件为准并修正另一份。

    - 所有路径都在相对前缀 `/api` 下（servers.url = /api），与前端同域部署。
    - 鉴权：`Authorization: Bearer <token>`（不透明会话令牌，服务端可吊销）。
    - 金额：**整数，单位人民币元**（不是分）。百分比为 0–100 的数字，系数为小数。
    - 时间：ISO 8601 且带时区（服务端输出 UTC `Z`，如 `2026-11-27T14:37:36.000Z`）；纯日期 `YYYY-MM-DD` 按 Asia/Shanghai。
    - 列表：`page`（从 1 开始）、`pageSize`（默认 50，最大 200）、`sort`（`字段` 升序 / `-字段` 降序，逗号分隔）、`q` 关键字及各资源过滤参数；响应 `{items,total,page,pageSize}`。
    - 错误：`{ "error": { "code", "message", "fields"?, "details"?, "requestId"? } }`。
    - 幂等：`POST /orders`、`POST /accounts/import`（dryRun=false）、`POST /orders/{id}/owner-payments` 接受可选请求头 `Idempotency-Key`（服务端保留 24 小时）。同键同请求体 → 重放首次响应（同状态码与响应体，带 `Idempotent-Replayed: true`）；同键不同请求体 → 409 `DUPLICATE`。
    - `x-status: proposed`：前端提议、后端尚未确认 / 实现的操作、参数或字段。客户端对其缺失做了降级（404 / 501 → 提示“后端暂未支持”或回退），契约测试的“每个操作都被用到”检查不包含它们。
    - **0.3.2 新增**（标了 `x-client-unused`，前端尚未接入）：`POST /rules/pricing/preview` 与 `POST /rules/pricing/apply`。改计价规则并重算未租库存必须走这两步；`PUT /rules/pricing` 仍只保存规则、不改已有报价。
    - 号主应付台账（/payables）与操作日志（/audit-logs）的 `sort` 接受 `createdAt` 作为 `at` 的别名。
    - 每个操作的 `x-roles` 列出允许的角色（owner 号主 / member 内部成员 / cs 客服 / ops 运营 / admin 管理员）；不在列表中的已登录角色返回 403。
    - 服务端是权限、字段裁剪、算价 / 估值、导入校验与状态流转的唯一权威；客户端算出的任何金额只作预览，服务端忽略并重算。
servers:
  - url: /api
security:
  - bearerAuth: []
tags:
  - { name: meta }
  - { name: auth }
  - { name: lobby, description: 前台大厅 / 算价 / 估值 / 客服 }
  - { name: owner, description: 号主门户（E1–E4） }
  - { name: accounts, description: 后台库存与批量导入 }
  - { name: uploads }
  - { name: orders, description: 出租订单、生命周期事件、押金台账、号主付款 }
  - { name: payables, description: 号主应付台账 }
  - { name: recycles }
  - { name: profiles, description: 租客 / 号主档案（C12） }
  - { name: rules, description: 计价规则与回收估值依据（版本化） }
  - { name: reports }
  - { name: admin, description: 看板、员工、操作日志、演示 }

paths:
  /meta:
    get:
      tags: [meta]
      operationId: getMeta
      summary: 运行信息与功能开关（无需登录）
      security: []
      x-roles: [public]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Meta' } } } }

  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: 账号密码登录，返回会话令牌
      security: []
      x-roles: [public]
      description: 失败统一返回 401 INVALID_CREDENTIALS（不区分账号不存在 / 密码错）；停用账号 403 USER_DISABLED；同一账号 / IP 失败过多 429 RATE_LIMITED。
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LoginRequest' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/LoginResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooMany' }
  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: 吊销当前令牌
      x-roles: [owner, member, cs, ops, admin]
      responses:
        '204': { description: 已退出 }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/me:
    get:
      tags: [auth]
      operationId: me
      summary: 当前登录用户（启动时调用；令牌失效 / 用户被停用返回 401）
      x-roles: [owner, member, cs, ops, admin]
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { type: object, required: [user], properties: { user: { $ref: '#/components/schemas/User' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /lobby/accounts:
    get:
      tags: [lobby]
      operationId: listLobbyAccounts
      summary: 大厅账号（仅 status=listed）
      description: |
        字段按角色裁剪：owner → quote 为 null，且不含 ownerId/ownerContact/costAmount；member → quote 只含租客应付字段（见 LobbyQuote），
        不含 ownerId/ownerContact/costAmount；cs/ops/admin → 完整 quote 与号主字段。
      x-roles: [owner, member, cs, ops, admin]
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
        - $ref: '#/components/parameters/sort'
        - $ref: '#/components/parameters/q'
        - { name: region, in: query, schema: { type: string } }
        - { name: channel, in: query, schema: { type: string } }
        - { name: rank, in: query, schema: { type: string } }
        - { name: safeBox, in: query, schema: { type: integer } }
        - { name: minCoin, in: query, schema: { type: number } }
        - { name: maxCoin, in: query, schema: { type: number } }
        - { name: maxTotal, in: query, description: 租客总金额上限（元），owner 角色忽略, schema: { type: integer } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/LobbyAccountPage' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /lobby/accounts/{id}:
    get:
      tags: [lobby]
      operationId: getLobbyAccount
      summary: 大厅账号详情（裁剪规则同列表；非员工访问未上架账号返回 404）
      x-roles: [owner, member, cs, ops, admin]
      parameters: [ { $ref: '#/components/parameters/id' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/LobbyAccount' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /pricing/options:
    get:
      tags: [lobby]
      operationId: getPricingOptions
      summary: 前台算价下拉选项（不含服务费率等内部参数）
      x-roles: [owner, member, cs, ops, admin]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PricingOptions' } } } }
  /pricing/quote:
    post:
      tags: [lobby]
      operationId: quotePricing
      summary: 出租精准算价（服务端按当前规则计算；填 renterContact 且为熟客时自动带入熟客优惠）
      description: |
        响应按角色裁剪：owner → 只有 {ruleVersion, ownerSettlement}；member → 去掉 serviceFeeRate/serviceFee/ownerSettlement；员工 → 完整 PricingResult。
        请求里的 renterRegular 由服务端根据租客档案判定，客户端传入的值被忽略。
      x-roles: [owner, member, cs, ops, admin]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PricingInput' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PricingResultPartial' } } } }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /valuation/quote:
    post:
      tags: [lobby]
      operationId: quoteValuation
      summary: 回收估值（服务端按当前估值依据计算）
      x-roles: [owner, member, cs, ops, admin]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ValuationInput' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ValuationResult' } } } }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /dicts:
    get:
      tags: [lobby]
      operationId: getDicts
      x-status: proposed
      summary: 选项字典（大区、上号方式、段位、保险格、体力、负重、皮肤及分类）；只读，由服务端配置种子提供
      description: |
        【提议，后端未实现】后端目前的口径是字典走 GET /accounts/import/context + GET /pricing/options，但 import/context 只对 ops / admin 开放，
        号主上架、前台筛选、算价页（owner / member / cs）拿不到字典，所以提议这个所有登录角色可读的只读接口。
        前端降级：404 / 501 时，ops / admin 用 import/context（皮肤分类沿用内置字典），其他角色用内置字典。
        渠道与租赁周期来自计价规则，见 GET /pricing/options。客服排班只读：GET /cs-agents、GET /cs-agents/current。
      x-roles: [owner, member, cs, ops, admin]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Dicts' } } } }
  /cs-agents:
    get:
      tags: [lobby]
      operationId: listCsAgents
      summary: 客服列表与排班
      x-roles: [owner, member, cs, ops, admin]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/CsAgent' } } } } }
  /cs-agents/current:
    get:
      tags: [lobby]
      operationId: currentCsAgent
      summary: 当前在班客服（按服务器时间、Asia/Shanghai 排班；无人在班时返回兜底客服或 null）
      x-roles: [owner, member, cs, ops, admin]
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { type: object, required: [agent], properties: { agent: { allOf: [ { $ref: '#/components/schemas/CsAgent' } ], nullable: true } } } } }

  /recycles:
    post:
      tags: [recycles]
      operationId: submitRecycle
      summary: 提交回收申请（服务端重新估值并保存估值快照）
      description: sourceAccountId 仅号主可用，且必须是本人账号、且该账号没有未结束的回收单，否则 403 / 409。
      x-roles: [owner, member, cs, ops, admin]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RecycleCreate' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/RecycleRequest' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    get:
      tags: [recycles]
      operationId: listRecycles
      summary: 回收单（后台）
      x-roles: [cs, ops, admin]
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
        - $ref: '#/components/parameters/sort'
        - $ref: '#/components/parameters/q'
        - { name: status, in: query, schema: { $ref: '#/components/schemas/RecycleStatus' } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/RecyclePage' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /recycles/mine:
    get:
      tags: [recycles]
      operationId: myRecycles
      summary: 我提交的回收单
      x-roles: [owner, member, cs, ops, admin]
      parameters: [ { $ref: '#/components/parameters/page' }, { $ref: '#/components/parameters/pageSize' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/RecyclePage' } } } }
  /recycles/{id}/transitions:
    post:
      tags: [recycles]
      operationId: transitionRecycle
      summary: 回收单状态流转（见 RecycleStatus 流转表；quoted 需 staffPrice > 0；deal 只能走 to-inventory）
      x-roles: [cs, ops, admin]
      parameters: [ { $ref: '#/components/parameters/id' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RecycleTransition' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/RecycleRequest' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /recycles/{id}/to-inventory:
    post:
      tags: [recycles]
      operationId: recycleToInventory
      summary: 成交入库（status quoted → deal）
      description: 有 sourceAccountId 时把原账号转为自收（formerOwnerId=原号主，costAmount=成交价，status=held）；否则新建自收账号（status=held）。
      x-roles: [cs, ops, admin]
      parameters: [ { $ref: '#/components/parameters/id' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AccountAdminView' } } } }
        '409': { $ref: '#/components/responses/Conflict' }

  /owner/accounts:
    get:
      tags: [owner]
      operationId: ownerAccounts
      summary: 号主门户：我的账号（owner 仅本人，含已转回收的原账号；admin 查看全部并带 ownerName）
      description: 响应是白名单字段 OwnerAccountView，永远不含租客信息、订单、租金、服务费与抽成。
      x-roles: [owner, admin]
      parameters: [ { $ref: '#/components/parameters/page' }, { $ref: '#/components/parameters/pageSize' }, { $ref: '#/components/parameters/sort' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/OwnerAccountPage' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /owner/accounts/{id}:
    get:
      tags: [owner]
      operationId: ownerAccount
      summary: 号主账号详情（非本人账号返回 404，不泄露存在性）
      x-roles: [owner, admin]
      parameters: [ { $ref: '#/components/parameters/id' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/OwnerAccountView' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /owner/accounts/{id}/recycle-draft:
    get:
      tags: [owner]
      operationId: ownerRecycleDraft
      summary: 用本人账号的资产预填回收估值表单
      x-roles: [owner]
      parameters: [ { $ref: '#/components/parameters/id' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ValuationInput' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /owner/estimate:
    post:
      tags: [owner]
      operationId: ownerEstimate
      summary: 上架前估算每租期到手（按 PricingRule.ownerDefaults）
      x-roles: [owner]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ValuationInput' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/OwnerEstimate' } } } }
  /owner/listings:
    post:
      tags: [owner]
      operationId: ownerSubmitListing
      summary: 号主上架新账号 → status=draft（待确认），source=consign；运营确认后才上架
      description: fromRecycleId 只能是本人的回收单。attachmentIds 必须是本人通过 /uploads 上传、尚未绑定的文件，最多 5 个。
      x-roles: [owner]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OwnerListingCreate' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/OwnerAccountView' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /accounts:
    get:
      tags: [accounts]
      operationId: listAccounts
      summary: 后台库存（含成本、累计收入、回本进度）
      x-roles: [cs, ops, admin]
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
        - $ref: '#/components/parameters/sort'
        - { name: q, in: query, description: 编号 / 号主联系方式 / 号主名称, schema: { type: string } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/AccountStatus' } }
        - { name: source, in: query, schema: { $ref: '#/components/schemas/AccountSource' } }
        - { name: ownerId, in: query, schema: { type: string } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AccountAdminPage' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [accounts]
      operationId: createAccount
      summary: 新增账号（服务端生成 accountNo 与报价快照 quote）
      description: status 只能是 draft / listed / off / held。consign 时按 ownerContact 关联或新建号主档案。
      x-roles: [ops, admin]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AccountWrite' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/AccountAdminView' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /accounts/{id}:
    put:
      tags: [accounts]
      operationId: updateAccount
      summary: 编辑账号（按当前规则重算 quote）
      description: status 只读——与当前值不同返回 409 INVALID_TRANSITION（改状态用 /status）。attachmentIds 省略 = 截图不变；传入 = 新的完整列表（顺序即展示顺序）。
      x-roles: [ops, admin]
      parameters: [ { $ref: '#/components/parameters/id' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AccountWrite' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AccountAdminView' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    delete:
      tags: [accounts]
      operationId: deleteAccount
      summary: 逻辑删除（rented / settling 不能删 → 409）；编号永久占用
      x-roles: [ops, admin]
      parameters: [ { $ref: '#/components/parameters/id' } ]
      responses:
        '204': { description: 已删除 }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /accounts/{id}/status:
    post:
      tags: [accounts]
      operationId: setAccountStatus
      summary: 人工状态流转（draft→listed/off，listed→off，off→listed，held→listed/off；rented/settling 只能由订单驱动）
      x-roles: [ops, admin]
      parameters: [ { $ref: '#/components/parameters/id' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [status], properties: { status: { $ref: '#/components/schemas/AccountStatus' } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AccountAdminView' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
  /accounts/import/context:
    get:
      tags: [accounts]
      operationId: importContext
      summary: 批量导入的校验上下文（字典 + 已占用编号，含已删除），供前端预览校验
      x-roles: [ops, admin]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ImportContext' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /accounts/import:
    post:
      tags: [accounts]
      operationId: importAccounts
      summary: 批量导入（服务端逐行重新校验；合法行一次性以 draft 入库，非法行跳过；写操作日志）
      description: |
        rows 为前端用 SheetJS 读出的二维数组，第 0 行是表头（列名见模板，允许带 * 与全角括号），数组下标 + 1 = Excel 行号。
        dryRun=true 时只返回逐行校验结果、不入库（响应 ImportPreview）。整份文件级错误（缺列、空文件、>500 行）→ 422 IMPORT_INVALID_FILE。
        校验规则以 src/domain/importAccounts.ts 为参考实现，tests/import.test.ts 的用例必须同样成立。
        Idempotency-Key 只对 dryRun=false 生效（dryRun=true 不落库，忽略该头）。
      x-roles: [ops, admin]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ImportRequest' } } } }
      responses:
        '200':
          description: OK（dryRun=false → ImportOutcome；dryRun=true → ImportPreview）
          headers: { Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' } }
          content: { application/json: { schema: { oneOf: [ { $ref: '#/components/schemas/ImportOutcome' }, { $ref: '#/components/schemas/ImportPreview' } ] } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /uploads:
    post:
      tags: [uploads]
      operationId: upload
      summary: 上传资产截图（multipart/form-data，字段名 file）
      description: |
        仅 image/png、image/jpeg、image/webp，≤ 1 MB（以服务端嗅探的真实类型为准）。返回的 id 在 24 小时内绑定到账号（AccountWrite.attachmentIds / OwnerListingCreate.attachmentIds），
        否则清理。url 是可直接放进 <img src> 的签名地址（<img> 不会带 Authorization 头），有效期 1 小时，过期时间见 expiresAt；过期后用 GET /uploads/{id} 重新签发。
      x-roles: [owner, ops, admin]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { type: object, required: [file], properties: { file: { type: string, format: binary } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Attachment' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '415': { $ref: '#/components/responses/Unsupported' }
  /uploads/{id}:
    get:
      tags: [uploads]
      operationId: getUpload
      x-status: proposed
      summary: 重新签发截图地址（url 过期后前端调用；返回新的 url 与 expiresAt）
      description: |
        【提议，后端未实现】可见性与引用它的资源一致：上传者本人；已绑定账号的截图对能看到该账号截图的角色可见（号主仅限自己的账号）。不可见 → 404。
        前端降级：404 / 501 时重新拉取引用该截图的资源（列表 / 详情接口每次都会重签 url）。
      x-roles: [owner, cs, ops, admin]
      parameters: [ { $ref: '#/components/parameters/id' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Attachment' } } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /orders:
    get:
      tags: [orders]
      operationId: listOrders
      summary: 出租订单（含 reminder 与本单号主应付余额）
      x-roles: [cs, ops, admin]
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
        - $ref: '#/components/parameters/sort'
        - { name: q, in: query, description: 订单号 / 账号编号 / 租客联系方式, schema: { type: string } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/OrderStatus' } }
        - { name: reminder, in: query, schema: { type: string, enum: [expiring, overdue] } }
        - { name: accountId, in: query, schema: { type: string } }
        - { name: from, in: query, description: createdAt ≥, schema: { type: string, format: date-time } }
        - { name: to, in: query, description: createdAt <, schema: { type: string, format: date-time } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/OrderPage' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [orders]
      operationId: createOrder
      summary: 登记出租订单（服务端按账号报价、熟客规则计算金额并锁定账号 listed → rented；计提号主应付）
      description: |
        黑名单联系方式 → 409 RENTER_BLACKLISTED（并写操作日志）；账号非 listed → 409 ACCOUNT_NOT_AVAILABLE。金额以服务端计算为准：
        租金与号主应付按账号报价快照所记录的计价规则版本（`account.quote.ruleVersion`）计算，改规则不影响已上架账号的价格；订单记录 `ruleVersion`。
        支持 Idempotency-Key（见下）。
      x-roles: [cs, ops, admin]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OrderCreate' } } } }
      responses:
        '201':
          description: Created（重放时同样是 201 + 首次的响应体）
          headers: { Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/RentalOrder' } } }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /orders/preview:
    post:
      tags: [orders]
      operationId: previewOrder
      summary: 登记前预览：租客档案、是否拦截、熟客优惠后的金额
      x-roles: [cs, ops, admin]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OrderPreviewRequest' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/OrderPreview' } } } }
  /orders/{id}:
    get:
      tags: [orders]
      operationId: getOrder
      summary: 订单详情（含 events 生命周期事件与 deposits 押金台账；前端打开详情抽屉与每次操作后用它刷新）
      x-roles: [cs, ops, admin]
      parameters: [ { $ref: '#/components/parameters/id' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/OrderView' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /orders/{id}/handover:
    post:
      tags: [orders]
      operationId: orderHandover
      summary: 登记交号（active 且未交号）
      x-roles: [cs, ops, admin]
      parameters: [ { $ref: '#/components/parameters/id' } ]
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/NoteBody' } } } }
      responses:
        '200': { $ref: '#/components/responses/OrderOk' }
        '409': { $ref: '#/components/responses/Conflict' }
  /orders/{id}/extend:
    post:
      tags: [orders]
      operationId: orderExtend
      summary: 改租期（active；rentalDays ≥ 1，按新天数重算 endAt）
      x-roles: [cs, ops, admin]
      parameters: [ { $ref: '#/components/parameters/id' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [rentalDays], properties: { rentalDays: { type: integer, minimum: 1 }, note: { type: string, maxLength: 500 } } } } }
      responses:
        '200': { $ref: '#/components/responses/OrderOk' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /orders/{id}/end:
    post:
      tags: [orders]
      operationId: orderEnd
      summary: 到期结束（active → settling；账号 rented → settling）
      x-roles: [cs, ops, admin]
      parameters: [ { $ref: '#/components/parameters/id' } ]
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/NoteBody' } } } }
      responses:
        '200': { $ref: '#/components/responses/OrderOk' }
        '409': { $ref: '#/components/responses/Conflict' }
  /orders/{id}/return:
    post:
      tags: [orders]
      operationId: orderReturn
      summary: 登记还号（settling 且未还号）
      x-roles: [cs, ops, admin]
      parameters: [ { $ref: '#/components/parameters/id' } ]
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/NoteBody' } } } }
      responses:
        '200': { $ref: '#/components/responses/OrderOk' }
        '409': { $ref: '#/components/responses/Conflict' }
  /orders/{id}/deposits:
    post:
      tags: [orders]
      operationId: addDepositEntry
      summary: 押金台账记一笔（collect 收取 / deduct 扣除 / refund 退还；扣除与退还不得超过余额；订单关闭后 409）
      x-roles: [cs, ops, admin]
      parameters: [ { $ref: '#/components/parameters/id' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DepositEntryCreate' } } } }
      responses:
        '200': { $ref: '#/components/responses/OrderOk' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /orders/{id}/owner-payments:
    post:
      tags: [orders]
      operationId: payOwner
      summary: 登记付号主款（≤ 本单号主应付余额；写 OwnerPayableEntry type=pay）
      description: 支持 Idempotency-Key（重放时带 Idempotent-Replayed 头）。
      x-roles: [cs, ops, admin]
      parameters: [ { $ref: '#/components/parameters/id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [amount], properties: { amount: { $ref: '#/components/schemas/Money' }, note: { type: string, maxLength: 500 } } } } }
      responses:
        '200':
          description: 更新后的订单
          headers: { Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/RentalOrder' } } }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /orders/{id}/complete:
    post:
      tags: [orders]
      operationId: orderComplete
      summary: 结算完成（settling → done；押金余额与本单号主应付余额都须为 0，否则必须填 note；账号 → listed（relist）或 off）
      x-roles: [cs, ops, admin]
      parameters: [ { $ref: '#/components/parameters/id' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [relist], properties: { relist: { type: boolean }, note: { type: string, maxLength: 500 } } } } }
      responses:
        '200': { $ref: '#/components/responses/OrderOk' }
        '409': { $ref: '#/components/responses/Conflict' }
  /orders/{id}/cancel:
    post:
      tags: [orders]
      operationId: orderCancel
      summary: 取消（仅 active 且未交号；退还押金、冲销号主应付 type=reverse；账号 → listed）
      x-roles: [cs, ops, admin]
      parameters: [ { $ref: '#/components/parameters/id' } ]
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/NoteBody' } } } }
      responses:
        '200': { $ref: '#/components/responses/OrderOk' }
        '409': { $ref: '#/components/responses/Conflict' }

  /payables:
    get:
      tags: [payables]
      operationId: listPayables
      summary: 号主应付台账流水（accrue 计提 / pay 付款 / reverse 冲销）
      x-roles: [cs, ops, admin]
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
        - { name: sort, in: query, description: '可排序字段 at / amount / accountNo；createdAt 是 at 的别名；默认 -at', schema: { type: string } }
        - { name: ownerId, in: query, schema: { type: string } }
        - { name: orderId, in: query, x-status: proposed, description: '【提议】只看某张订单的流水（订单详情用）。后端忽略时前端会自行按 orderId 过滤', schema: { type: string } }
        - { name: type, in: query, schema: { type: string, enum: [accrue, pay, reverse] } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PayablePage' } } } }

  /renters:
    get:
      tags: [profiles]
      operationId: listRenters
      summary: 租客档案（含由订单汇总的租过次数、消费、押金扣除次数）
      x-roles: [cs, ops, admin]
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
        - $ref: '#/components/parameters/sort'
        - $ref: '#/components/parameters/q'
        - { name: tag, in: query, schema: { $ref: '#/components/schemas/RenterTag' } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/RenterPage' } } } }
    post:
      tags: [profiles]
      operationId: saveRenter
      summary: 新建 / 更新租客档案（按 contact 规范化后 upsert：去首尾空格、小写；写操作日志）
      x-roles: [cs, ops, admin]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RenterUpsert' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/RenterProfile' } } } }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /renters/lookup:
    get:
      tags: [profiles]
      operationId: lookupRenter
      summary: 按联系方式查档案（规范化匹配；无档案时 profile=null）
      x-roles: [cs, ops, admin]
      parameters: [ { name: contact, in: query, required: true, schema: { type: string } } ]
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { type: object, required: [profile], properties: { profile: { allOf: [ { $ref: '#/components/schemas/RenterProfile' } ], nullable: true } } } } }
  /owners:
    get:
      tags: [profiles]
      operationId: listOwners
      summary: 号主档案（寄租数、累计应付、已结、余额）
      x-roles: [cs, ops, admin]
      parameters: [ { $ref: '#/components/parameters/page' }, { $ref: '#/components/parameters/pageSize' }, { $ref: '#/components/parameters/sort' }, { $ref: '#/components/parameters/q' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/OwnerPage' } } } }

  /rules/pricing:
    get:
      tags: [rules]
      operationId: getPricingRule
      summary: 当前出租计价规则（含服务费率，仅员工）
      x-roles: [cs, ops, admin]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PricingRule' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [rules]
      operationId: savePricingRule
      summary: 保存计价规则 → 生成新版本（version = 当前 + 1）
      description: |
        请求体 rule.version 必须等于当前版本，否则 409 VERSION_CONFLICT（乐观锁）。
        本接口不改已有账号报价。要按新规则重算未租库存，走 POST /rules/pricing/preview 再 POST /rules/pricing/apply（0.3.2）。
      x-roles: [ops, admin]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PricingRuleSave' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PricingRule' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /rules/pricing/preview:
    post:
      tags: [rules]
      operationId: previewPricingReprice
      x-client-unused: true
      summary: 【0.3.2 新增】预览未租账号在新计价规则下的价格（不落库）
      description: |
        干跑。请求体与 PUT /rules/pricing 相同（`{ rule, summary? }`，`rule.version` 必须等于当前版本，否则 409 VERSION_CONFLICT）。
        只列出将被重算的账号：未删除，且状态不是 rented / settling，也没有 status 为 active / settling 的订单。租赁中、待结算、以及挂着进行中订单的账号不出现。
        `oldPrice` / `newPrice` 是折后纯币租金 `quote.coinRent`（整数元），`delta = newPrice - oldPrice`（可为负）。`count` 含价格不变（delta 为 0）的账号，因为确认后它们也会盖上新的 ruleVersion。
        一次返回全部受影响账号，不分页。
        `fingerprint` 是 SHA-256（hex）。输入为：当前规则版本、提议规则的稳定 JSON、每条未删除账号的 id/状态/更新时间/报价版本/coinRent/totalAmount、每条订单的 id/accountId/status。规则正文或库存相对预览有变化时，确认保存会得到 409 STALE_PREVIEW。
      x-roles: [ops, admin]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PricingRuleSave' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PricingRepricePreview' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /rules/pricing/apply:
    post:
      tags: [rules]
      operationId: applyPricingReprice
      x-client-unused: true
      summary: 【0.3.2 新增】确认保存计价规则，并在同一事务里重算未租账号
      description: |
        必须 `confirm: true`，并带上预览返回的 `baseVersion` 与 `fingerprint`。缺确认 → 422 VALIDATION_FAILED（fields 含 confirm）。
        当前规则版本或库存（账号报价 / 状态 / 订单）或提议的规则正文与预览不一致 → 409 STALE_PREVIEW，不写入。
        成功时在同一个数据库事务里：规则版本 +1 并写入版本历史、重写受影响账号的完整报价并盖上新 ruleVersion、写一条操作日志（含 v旧 → v新、重算账号数、租金变化数）。
        租赁中、待结算、以及挂着 active / settling 订单的账号报价不变，进行中的订单仍使用下单时的报价快照。
        `PUT /rules/pricing` 不走这条路径。
      x-roles: [ops, admin]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PricingRepriceApply' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PricingRepriceResult' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /rules/valuation:
    get:
      tags: [rules]
      operationId: getValuationRule
      summary: 当前回收估值依据（市场系数、保险格系数、参考成交价等）
      x-roles: [ops, admin]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ValuationRule' } } } }
    put:
      tags: [rules]
      operationId: saveValuationRule
      summary: 保存估值依据 → 生成新版本（乐观锁同上）；历史回收单保留当时的估值快照
      x-roles: [ops, admin]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ValuationRuleSave' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ValuationRule' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /rules/versions:
    get:
      tags: [rules]
      operationId: ruleVersions
      summary: 两类规则的版本历史（新→旧）
      x-roles: [ops, admin]
