                type: object
                required: [pricing, valuation]
                properties:
                  pricing: { type: array, items: { $ref: '#/components/schemas/RuleVersionMeta' } }
                  valuation: { type: array, items: { $ref: '#/components/schemas/RuleVersionMeta' } }
  /rules/pricing/trial:
    post:
      tags: [rules]
      operationId: trialPricing
