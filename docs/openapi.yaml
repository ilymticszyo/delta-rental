  /staff:
    get:
      tags: [admin]
      operationId: listStaff
      summary: 全部用户（含号主与成员）及启用状态
      x-roles: [admin]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/StaffUser' } } } } }
    post:
      tags: [admin]
      operationId: createStaff
      x-status: proposed
      summary: 新建用户（员工 / 成员 / 号主登录）；role=owner 时必须绑定一个尚未绑定的号主档案（一对一）
      description: |
        【提议，后端未实现，待用户确认】前端“新建用户”表单在 404 / 501 时提示“后端暂未支持”。
        用户名唯一（大小写不敏感）→ 重复 409 DUPLICATE；ownerId 已被其他用户绑定 → 409 OWNER_ALREADY_BOUND；
        role=owner 缺 ownerId、非 owner 传 ownerId、ownerId 不存在、密码过短 → 422 VALIDATION_FAILED（fields 指明字段）。
        成功后号主档案的 userId 指向该用户；写操作日志「新建用户」（不记录密码）。密码只存哈希，响应不返回。
      x-roles: [admin]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/StaffCreate' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/StaffUser' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /staff/{username}:
    patch:
      tags: [admin]
      operationId: setStaffEnabled
      summary: 启用 / 停用（停用立即吊销该用户全部令牌；不能停用自己或最后一个管理员 → 409）
      x-roles: [admin]
      parameters: [ { name: username, in: path, required: true, schema: { type: string } } ]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [enabled], properties: { enabled: { type: boolean } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/StaffUser' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
  /staff/{username}/password:
    post:
      tags: [admin]
      operationId: resetStaffPassword
      x-status: proposed
      summary: 管理员重置用户密码（立即吊销该用户全部令牌；写操作日志「重置密码」，不记录密码）
      description: 【提议，后端未实现，待用户确认】前端暂无入口。密码至少 8 位 → 否则 422。
      x-roles: [admin]
      parameters: [ { name: username, in: path, required: true, schema: { type: string } } ]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [password], properties: { password: { type: string, minLength: 8, maxLength: 128 } } } } }
      responses:
        '204': { description: 已重置 }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /audit-logs:
    get:
      tags: [admin]
      operationId: listAuditLogs
      summary: 操作日志（新→旧，只增不改）
      x-roles: [admin]
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
        - { name: sort, in: query, description: '可排序字段 at / actor / action；createdAt 是 at 的别名；默认 -at', schema: { type: string } }
        - $ref: '#/components/parameters/q'
        - { name: actor, in: query, schema: { type: string } }
        - { name: action, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AuditLogPage' } } } }
  /demo/reset:
    post:
      tags: [admin]
      operationId: resetDemo
      summary: 重置演示数据（仅 Meta.demo=true 的演示环境存在；生产环境 404）
      x-roles: [admin]
      responses:
        '204': { description: 已重置 }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, description: 不透明会话令牌（≥128 位随机，服务端存哈希），有效期 12 小时滑动续期，最长 7 天 }

  parameters:
    id: { name: id, in: path, required: true, schema: { type: string } }
    page: { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
    pageSize: { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
    sort: { name: sort, in: query, description: '逗号分隔，`-` 前缀为降序，如 `-createdAt,accountNo`；未知字段 422', schema: { type: string } }
    q: { name: q, in: query, description: 关键字（模糊匹配，大小写不敏感）, schema: { type: string } }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        可选。客户端每次“提交动作”生成一个 UUID（v4），重试 / 双击时复用同一个。服务端保留 24 小时：
        同键 + 同请求体 → 重放首次响应（状态码与响应体相同，含首次的 4xx 业务错误），并带 `Idempotent-Replayed: true`；
        同键 + 不同请求体 → 409 DUPLICATE。键的作用域为当前用户 + 路径。
        建议：5xx、401、403、429 不保存（同键可再试）；首次请求仍在处理中时同键请求等待其完成后重放（处理方式由后端定）。
      schema: { type: string, minLength: 8, maxLength: 128, pattern: '^[A-Za-z0-9_-]+$', example: 3f0e1c9a-5b7d-4c1e-9a2f-6d8b0c4e1a7f }

  headers:
    IdempotentReplayed:
      description: '可选（建议）：true 表示这是同一 Idempotency-Key 的重放响应（未重复执行）'
      schema: { type: string, enum: ['true'] }

  responses:
    Unauthorized: { description: 未登录 / 令牌失效 / 用户被停用, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    Forbidden: { description: 角色无权限, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    NotFound: { description: 不存在或对当前用户不可见, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    Conflict: { description: 状态冲突（非法流转、重复、黑名单、版本冲突 VERSION_CONFLICT、预览过期 STALE_PREVIEW）, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    Unprocessable: { description: 校验失败（fields 给出字段级错误）, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    TooLarge: { description: 请求体 / 文件过大, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    Unsupported: { description: 不支持的文件类型, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    TooMany: { description: 频率限制, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    OrderOk: { description: OK（更新后的订单）, content: { application/json: { schema: { $ref: '#/components/schemas/RentalOrder' } } } }

  schemas:
    Money: { type: integer, minimum: 0, description: 人民币元（整数）。非整数 → 422 }
    DateTime: { type: string, format: date-time, description: ISO 8601 带时区，例 2026-11-27T14:37:36.000Z }

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, description: '机器可读错误码，见契约错误码表（幂等键配不同请求体也是 DUPLICATE）', example: VALIDATION_FAILED }
            message: { type: string, description: 可直接展示给用户的中文说明 }
            fields: { type: array, items: { $ref: '#/components/schemas/FieldError' } }
            details: { type: object, additionalProperties: true }
            requestId: { type: string }
    FieldError:
      type: object
      required: [field, message]
      properties:
        field: { type: string, description: 'JSON 路径，如 coinAmount、asset.skins[1]、rows[3]' }
        message: { type: string }

    PageMeta:
      type: object
      required: [total, page, pageSize]
      properties: { total: { type: integer }, page: { type: integer }, pageSize: { type: integer } }

    Role: { type: string, enum: [owner, member, cs, ops, admin] }
    User:
      type: object
      required: [username, displayName, role]
      properties:
        username: { type: string }
        displayName: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        ownerId: { type: string, description: 'role=owner 时必有：绑定的号主档案 id（一对一，对应 OwnerProfile.userId）；其他角色省略' }
    StaffUser:
      allOf: [ { $ref: '#/components/schemas/User' }, { type: object, required: [enabled], properties: { enabled: { type: boolean } } } ]
    StaffCreate:
      type: object
      required: [username, displayName, role, password]
      properties:
        username: { type: string, pattern: '^[A-Za-z0-9_.-]{3,32}$', description: 登录名，唯一（大小写不敏感） }
        displayName: { type: string, minLength: 1, maxLength: 64 }
        role: { $ref: '#/components/schemas/Role' }
        password: { type: string, minLength: 8, maxLength: 128, description: 初始密码（只存哈希，不回显） }
        ownerId: { type: string, description: role=owner 时必填，且该号主档案未绑定其他用户；其他角色不得传 }
    Dicts:
      type: object
      required: [regions, loginMethods, ranks, safeBoxes, stamina, loads, skins]
      properties:
        regions: { type: array, items: { type: string } }
        loginMethods: { type: array, items: { type: string } }
        ranks: { type: array, items: { type: string } }
        safeBoxes: { type: array, items: { type: integer } }
        stamina: { type: array, items: { type: string } }
        loads: { type: array, items: { type: string } }
        skins:
          type: array
          items: { type: object, required: [name, category], properties: { name: { type: string }, category: { type: string, example: 红皮 } } }
    DemoAccount:
      type: object
      required: [username, password, role, displayName]
      properties: { username: { type: string }, password: { type: string }, role: { $ref: '#/components/schemas/Role' }, displayName: { type: string } }
    Meta:
      type: object
      required: [version, demo]
      properties:
        version: { type: string, description: 后端版本 }
        demo: { type: boolean, description: 'true 时前端显示演示账号、角色切换、重置数据；生产必须为 false' }
        demoAccounts: { type: array, items: { $ref: '#/components/schemas/DemoAccount' }, description: 仅 demo=true }
        serverTime: { $ref: '#/components/schemas/DateTime' }
    LoginRequest:
      type: object
      required: [username, password]
      properties: { username: { type: string, maxLength: 64 }, password: { type: string, maxLength: 128 } }
    LoginResponse:
      type: object
      required: [token, expiresAt, user]
      properties: { token: { type: string }, expiresAt: { $ref: '#/components/schemas/DateTime' }, user: { $ref: '#/components/schemas/User' } }

    Attachment:
      type: object
      required: [id, name, url, uploadedBy, at]
      properties:
        id: { type: string }
        name: { type: string }
        url: { type: string, description: '<img src> 可用的签名地址，有效期 1 小时；过期后 GET /uploads/{id} 重新签发' }
        expiresAt: { allOf: [ { $ref: '#/components/schemas/DateTime' } ], x-status: proposed, description: '【提议】url 过期时间；前端据此提前续签。缺省时前端只在图片加载失败时续签' }
        mime: { type: string }
        size: { type: integer, description: 字节 }
        uploadedBy: { type: string }
        at: { $ref: '#/components/schemas/DateTime' }

    AccountStatus:
      type: string
      enum: [draft, listed, rented, settling, off, held]
      description: draft 草稿/待确认 · listed 空闲可租 · rented 租赁中 · settling 待结算 · off 已下架 · held 已回收持有
    AccountSource: { type: string, enum: [consign, buyin], description: consign 号主寄租 · buyin 自收 }
    DiscountMode: { type: string, enum: [system, custom] }
    AccountFields:
      type: object
      description: 账号可编辑字段（与模板导入列一一对应）
      required: [status, source, ownerContact, costAmount, region, loginMethod, channel, assistTime, banRecord, totalAssets, coinAmount, secretKd, level, rank, safeBox, stamina, load, awmCount, helmet6Count, armor6Count, experienceCardCount, skins, cycle, coinRatio, discountMode, deposit, remark]
      properties:
        status: { $ref: '#/components/schemas/AccountStatus' }
        source: { $ref: '#/components/schemas/AccountSource' }
        ownerId: { type: string, description: 服务端根据 ownerContact 关联，客户端可不传 }
        ownerContact: { type: string, description: consign 必填；buyin 为 “自有” }
        costAmount: { $ref: '#/components/schemas/Money' }
        region: { type: string, description: 字典 regions }
        loginMethod: { type: string, description: 字典 loginMethods }
        channel: { type: string, description: PricingRule.channelFeeRates 的键 }
        assistTime: { type: string, example: '09:00-23:00' }
        banRecord: { type: boolean }
        totalAssets: { type: number, description: M，≥ coinAmount }
        coinAmount: { type: number, exclusiveMinimum: true, minimum: 0, description: 纯币 M }
        secretKd: { type: number }
        level: { type: integer, minimum: 1, maximum: 200 }
        rank: { type: string }
        safeBox: { type: integer, enum: [2, 4, 6, 9] }
        stamina: { type: string, example: 5级 }
        load: { type: string, example: 5级 }
        awmCount: { type: integer, minimum: 0 }
        helmet6Count: { type: integer, minimum: 0 }
        armor6Count: { type: integer, minimum: 0 }
        experienceCardCount: { type: integer, minimum: 0 }
        skins: { type: array, items: { type: string }, description: 字典皮肤名 }
        cycle: { type: string, description: PricingRule.cycleValues 的键 }
        coinRatio: { type: number, exclusiveMinimum: true, minimum: 0, description: 1:N 的 N（W/元） }
        discountMode: { $ref: '#/components/schemas/DiscountMode' }
        customDiscountPercent: { type: number, minimum: 1, maximum: 100, description: discountMode=custom 时必填，且在 customDiscountMin–Max 内 }
        deposit: { $ref: '#/components/schemas/Money' }
        remark: { type: string, maxLength: 500 }
    AccountWrite:
      allOf:
        - { $ref: '#/components/schemas/AccountFields' }
        - type: object
          properties:
            attachmentIds: { type: array, maxItems: 5, items: { type: string }, description: '省略 = 不变；新上传的 id 或本账号已有截图 id' }
    Account:
      allOf:
        - { $ref: '#/components/schemas/AccountFields' }
        - type: object
          required: [id, accountNo, attachments, quote, createdAt, updatedAt]
          properties:
            id: { type: string }
            accountNo: { type: string, description: '服务端生成 DF+序号；导入可指定，全局唯一（含已删除），大小写不敏感' }
            formerOwnerId: { type: string }
            attachments: { type: array, items: { $ref: '#/components/schemas/Attachment' } }
            quote: { $ref: '#/components/schemas/PricingResult' }
            createdAt: { $ref: '#/components/schemas/DateTime' }
            updatedAt: { $ref: '#/components/schemas/DateTime' }
    AccountAdminView:
      allOf:
        - { $ref: '#/components/schemas/Account' }
        - type: object
          required: [cumulativeIncome, paybackPercent]
          properties:
            cumulativeIncome: { $ref: '#/components/schemas/Money' }
            paybackPercent: { type: number, nullable: true, description: '仅 buyin 且 costAmount>0：累计平台收入 / 成本 × 100（两位小数）' }
            ownerName: { type: string }
    AccountAdminPage:
      allOf: [ { $ref: '#/components/schemas/PageMeta' }, { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/AccountAdminView' } } } } ]
    LobbyQuote:
      type: object
      description: 租客应付部分（member 可见）。员工额外可见 serviceFeeRate / serviceFee / ownerSettlement
      properties:
        ruleVersion: { type: integer }
        usedRatio: { type: number }
        tierHit: { type: string, nullable: true }
        discountPercent: { type: number }
        originalCoinRent: { $ref: '#/components/schemas/Money' }
        coinRent: { $ref: '#/components/schemas/Money' }
        extraFee: { $ref: '#/components/schemas/Money' }
        renterRent: { $ref: '#/components/schemas/Money' }
        deposit: { $ref: '#/components/schemas/Money' }
        totalAmount: { $ref: '#/components/schemas/Money' }
        rentalDays: { type: integer }
        serviceFeeRate: { type: number, description: 仅员工 }
        serviceFee: { type: integer, description: 仅员工 }
        ownerSettlement: { type: integer, description: 仅员工 }
    LobbyAccount:
      type: object
      description: |
        Account 去掉 quote/ownerContact/ownerId/formerOwnerId/costAmount，再按角色加回：
        owner → quote=null，且不含 deposit/coinRatio/discountMode/customDiscountPercent（任何租价参数都不给号主）；
        member → quote 为 LobbyQuote 子集；员工 → 完整 quote + ownerContact/ownerId/costAmount。
      required: [id, accountNo, status, source, region, loginMethod, channel, coinAmount, totalAssets, rank, safeBox, skins, cycle, attachments, quote]
      properties:
        id: { type: string }
        accountNo: { type: string }
        status: { $ref: '#/components/schemas/AccountStatus' }
        source: { $ref: '#/components/schemas/AccountSource' }
        region: { type: string }
        loginMethod: { type: string }
        channel: { type: string }
        assistTime: { type: string }
        banRecord: { type: boolean }
        totalAssets: { type: number }
        coinAmount: { type: number }
        secretKd: { type: number }
        level: { type: integer }
        rank: { type: string }
        safeBox: { type: integer }
        stamina: { type: string }
        load: { type: string }
        awmCount: { type: integer }
        helmet6Count: { type: integer }
        armor6Count: { type: integer }
        experienceCardCount: { type: integer }
        skins: { type: array, items: { type: string } }
        cycle: { type: string }
        coinRatio: { type: number, description: owner 不返回 }
        discountMode: { $ref: '#/components/schemas/DiscountMode' }
        customDiscountPercent: { type: number, description: owner 不返回 }
        deposit: { type: integer, minimum: 0, description: owner 不返回 }
        remark: { type: string }
        attachments: { type: array, items: { $ref: '#/components/schemas/Attachment' } }
        quote: { allOf: [ { $ref: '#/components/schemas/LobbyQuote' } ], nullable: true }
        ownerContact: { type: string, description: 仅员工 }
        ownerId: { type: string, description: 仅员工 }
        costAmount: { type: integer, description: 仅员工 }
        createdAt: { $ref: '#/components/schemas/DateTime' }
        updatedAt: { $ref: '#/components/schemas/DateTime' }
    LobbyAccountPage:
      allOf: [ { $ref: '#/components/schemas/PageMeta' }, { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/LobbyAccount' } } } } ]

    PricingInput:
      type: object
      required: [coinAmount, totalAssets, coinRatio, channel, discountMode, cycle, deposit]
      properties:
        coinAmount: { type: number }
        totalAssets: { type: number }
        coinRatio: { type: number }
        channel: { type: string }
        discountMode: { $ref: '#/components/schemas/DiscountMode' }
        customDiscountPercent: { type: number }
        cycle: { type: string }
        deposit: { $ref: '#/components/schemas/Money' }
        renterContact: { type: string, description: 可选；为熟客时自动带入熟客优惠 }
        renterRegular: { type: boolean, description: 服务端忽略客户端传值 }
    PricingResult:
      type: object
      description: 'PRD 7.1，逐步取整到元。参考实现 src/domain/pricing.ts'
      required: [ruleVersion, usedRatio, tierHit, discountPercent, originalCoinRent, coinRent, serviceFeeRate, serviceFee, ownerSettlement, extraFee, renterRent, deposit, totalAmount, rentalDays, regularDiscountApplied, depositWaived]
      properties:
        ruleVersion: { type: integer }
        usedRatio: { type: number }
        tierHit: { type: string, nullable: true }
        discountPercent: { type: number }
        originalCoinRent: { $ref: '#/components/schemas/Money' }
        coinRent: { $ref: '#/components/schemas/Money' }
        serviceFeeRate: { type: number, description: '%' }
        serviceFee: { $ref: '#/components/schemas/Money' }
        ownerSettlement: { $ref: '#/components/schemas/Money' }
        extraFee: { $ref: '#/components/schemas/Money' }
        renterRent: { $ref: '#/components/schemas/Money' }
        deposit: { $ref: '#/components/schemas/Money' }
        totalAmount: { $ref: '#/components/schemas/Money' }
        rentalDays: { type: integer }
        regularDiscountApplied: { type: boolean }
        depositWaived: { type: boolean }
    PricingResultPartial:
      type: object
      description: 按角色裁剪后的 PricingResult（owner 只有 ruleVersion + ownerSettlement）
      properties:
        ruleVersion: { type: integer }
        usedRatio: { type: number }
        tierHit: { type: string, nullable: true }
        discountPercent: { type: number }
        originalCoinRent: { type: integer }
        coinRent: { type: integer }
        serviceFeeRate: { type: number }
        serviceFee: { type: integer }
        ownerSettlement: { type: integer }
        extraFee: { type: integer }
        renterRent: { type: integer }
        deposit: { type: integer }
        totalAmount: { type: integer }
        rentalDays: { type: integer }
        regularDiscountApplied: { type: boolean }
        depositWaived: { type: boolean }
    PricingOptions:
      type: object
      required: [version, channels, cycles, customDiscountMin, customDiscountMax, defaultDeposit]
      properties:
        version: { type: integer }
        channels: { type: array, items: { type: string } }
        cycles: { type: array, items: { type: string } }
        customDiscountMin: { type: number }
        customDiscountMax: { type: number }
        defaultDeposit: { $ref: '#/components/schemas/Money' }

    ValuationInput:
      type: object
      required: [contact, region, loginMethod, coinAmount, totalAssets, level, rank, safeBox, skins, banRecord, awmCount, helmet6Count, armor6Count, experienceCardCount]
      properties:
        contact: { type: string }
        region: { type: string }
        loginMethod: { type: string }
        coinAmount: { type: number }
        totalAssets: { type: number }
        level: { type: integer }
        rank: { type: string }
        safeBox: { type: integer }
        skins: { type: array, items: { type: string } }
        banRecord: { type: boolean }
        awmCount: { type: integer }
        helmet6Count: { type: integer }
        armor6Count: { type: integer }
