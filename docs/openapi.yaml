      x-roles: [ops, admin]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [input, rule], properties: { input: { $ref: '#/components/schemas/PricingInput' }, rule: { $ref: '#/components/schemas/PricingRule' } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PricingResult' } } } }
  /rules/valuation/trial:
    post:
      tags: [rules]
      operationId: trialValuation
      summary: 用未保存的估值依据试算（不落库）
      x-roles: [ops, admin]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [input, rule], properties: { input: { $ref: '#/components/schemas/ValuationInput' }, rule: { $ref: '#/components/schemas/ValuationRule' } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ValuationResult' } } } }

