# 前端静态站 + /api 反向代理（nginx / OpenResty 通用）。
# Docker 镜像里它作为模板：启动时用环境变量替换 ${API_UPSTREAM}、${CSP_IMG_EXTRA}（官方 nginx 镜像的 /etc/nginx/templates 机制，
# 只替换已定义的环境变量，$host 这类 nginx 变量不受影响）。
# 1Panel / 手工部署：把 ${API_UPSTREAM} 换成后端地址（如 http://127.0.0.1:8080），${CSP_IMG_EXTRA} 换成空或 OSS 域名。
server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;

    # 截图 ≤1MB、导入请求体 ≤5MB，留余量
    client_max_body_size 6m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    include /etc/nginx/conf.d/security-headers.inc;

    # 健康检查（容器 HEALTHCHECK / 负载均衡用）
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # 后端接口：保留 /api 前缀原样转发（proxy_pass 末尾不带 /）
    location /api/ {
        proxy_pass ${API_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
        # 后端出错时也返回契约格式的 JSON，前端能显示友好提示
        proxy_intercept_errors off;
    }

    # 带内容哈希的构建产物：长期缓存
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/conf.d/security-headers.inc;
    }

    # 入口页：每次都向服务器确认，发版后立即生效
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/conf.d/security-headers.inc;
    }

    # SPA 回退：哈希路由下其实只会请求 /，但保留回退以兼容任意直链
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/conf.d/security-headers.inc;
    }
}
