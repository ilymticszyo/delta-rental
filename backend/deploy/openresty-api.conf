# 放到 1Panel / OpenResty 站点的 server 块里。
# 前端是 Vue history/hash 构建的静态文件；本仓库前端用 hash 路由，try_files 仍建议落到 index.html。
# 上传与导入的请求体上限 8m，和后端 express.json({ limit: '8mb' }) 一致。单张截图业务上限 1MB。

client_max_body_size 8m;

location /api/ {
    client_max_body_size 8m;
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
}

# 若 OpenResty 自己也在 Docker 里、访问不到 127.0.0.1:3000，改成宿主机网关，例如：
# proxy_pass http://172.17.0.1:3000;
# 并把 compose 的 api 端口改成 "3000:3000"（不要只绑 127.0.0.1），同时在安全组里不要对公网放行 3000。

location / {
    root /opt/1panel/www/sites/delta-rental/index;
    try_files $uri $uri/ /index.html;
}
